<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Полная маскировка под iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeHacker">
    
    <title>Lock Screen</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        
        /* Твои личные обои из фотошопа на весь экран */
        .lockscreen { 
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; 
            height: 100vh; 
            /* Подключаем твой личный скриншот из папки GitHub */
            background: url('my_screen.png') center/cover no-repeat; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            /* Точное позиционирование блока времени под Dynamic Island */
            padding-top: calc(env(safe-area-inset-top) + 40px);
            overflow: hidden;
            z-index: 1;
        }

        /* ЧАСЫ И ДАТА С ПОЛНЫМ СОВПАДЕНИЕМ СТИЛЯ */
        .clock-container {
            text-align: center;
            width: 100%;
            margin-top: 5px;
        }
        
        .date { 
            font-size: 21px; 
            color: #fff; 
            font-weight: 500; 
            letter-spacing: -0.1px;
            margin-bottom: 0px;
            opacity: 0.95;
        }
        
        /* Прозрачный стеклянный шрифт, один в один как на твоем оригинале */
        .time { 
            font-size: 102px; 
            font-weight: 700; 
            color: rgba(255, 255, 255, 0.44); 
            letter-spacing: -3px; 
            line-height: 0.9; 
            /* Легкое размытие для имитации стекла */
            backdrop-filter: blur(0.5px);
            -webkit-backdrop-filter: blur(0.5px);
        }

        /* ИНТЕРАКТИВНАЯ КНОПКА ФОНАРИКА (Скрытая зона поверх кнопки на твоих обоях) */
        .flashlight-trigger {
            position: fixed;
            /* Точные координаты левой нижней кнопки iPhone */
            bottom: calc(env(safe-area-inset-bottom) + 48px);
            left: 35px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            z-index: 100;
            cursor: pointer;
            /* Для тестов на ПК можно сделать видимым, сменив background */
            background: rgba(255,255,255,0.01); 
        }

        /* СКРЫТЫЕ СЕНСОРНЫЕ ЗОНЫ ДЛЯ УПРАВЛЕНИЯ ВРЕМЕНЕМ */
        .trigger-left { position: fixed; top: 0; left: 0; width: 30%; height: 35%; z-index: 98; cursor: pointer; }
        .trigger-right { position: fixed; top: 0; right: 0; width: 30%; height: 35%; z-index: 98; cursor: pointer; }
        .trigger-bottom { position: fixed; bottom: 0; left: 0; width: 100vw; height: 50vh; z-index: 97; cursor: pointer; }
        #hiddenInput { position: fixed; top: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; z-index: 10000; }
        video { display: none; }
    </style>
</head>
<body>

    <!-- Скрытые триггеры фокуса -->
    <div class="trigger-left" onclick="openSecretInput()"></div>
    <div class="trigger-right" onclick="setToFutureTime()"></div>
    <div class="trigger-bottom" onclick="rewindToPresent()"></div>
    <input type="text" id="hiddenInput" pattern="\d*" maxlength="4" oninput="updateStaticTime(this)">

    <!-- Рабочая кнопка активации вспышки -->
    <div class="flashlight-trigger" onclick="toggleFlashlight()"></div>
    <video id="flashVideo" autoplay playsinline></video>

    <!-- Основной контейнер времени -->
    <div class="lockscreen">
        <div class="clock-container">
            <div class="date" id="dateDisplay">Thu Aug 13</div>
            <div class="time" id="timeDisplay">06:00</div>
        </div>
    </div>

    <script>
        let mode = "normal"; 
        let futureOffset = 10; 
        let targetHours = 0;
        let targetMinutes = 0;
        let timerInterval;
        let track = null; // Для управления вспышкой

        // Автоматический формат даты: Thu Aug 13
        function updateDate() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('dateDisplay').innerText = `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()}`;
        }
        updateDate();

        function startClock() {
            timerInterval = setInterval(() => {
                if (mode === "normal") {
                    const now = new Date();
                    setTimeDisplay(now.getHours(), now.getMinutes());
                } else if (mode === "future") {
                    const futureTime = new Date(Date.now() + futureOffset * 60000);
                    setTimeDisplay(futureTime.getHours(), futureTime.getMinutes());
                }
            }, 1000);
        }

        function setTimeDisplay(h, m) {
            document.getElementById('timeDisplay').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        // АКТИВАЦИЯ НАСТОЯЩЕГО ФОНАРИКА НА ТЕЛЕФОНЕ
        async function toggleFlashlight() {
            try {
                if (!track) {
                    // Запрашиваем доступ к камере для обращения к вспышке
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const video = document.getElementById('flashVideo');
                    video.srcObject = stream;
                    track = stream.getVideoTracks()[0];
                    
                    // Включаем фонарик (torch)
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                } else {
                    // Выключаем фонарик
                    await track.applyConstraints({ advanced: [{ torch: false }] });
                    track.stop();
                    track = null;
                }
            } catch (err) {
                // Если запуск на ПК или нет вспышки, просто имитируем нажатие
                console.log("Фонарик доступен только на смартфонах");
            }
        }

        // Управление фокусом
        function openSecretInput() {
            if (mode !== "normal") return;
            mode = "static";
            const input = document.getElementById('hiddenInput');
            input.value = "";
            input.focus();
        }

        function updateStaticTime(input) {
            let val = input.value;
            if (val.length === 4) {
                targetHours = parseInt(val.substring(0, 2));
                targetMinutes = parseInt(val.substring(2, 4));
                if(targetHours > 23 || targetMinutes > 59) { input.value = ""; return; }
                setTimeDisplay(targetHours, targetMinutes);
                input.blur();
            }
        }

        function setToFutureTime() {
            if (mode !== "static") return;
            mode = "future";
        }

        function rewindToPresent() {
            if (mode !== "future") return;
            mode = "rewinding";
            clearInterval(timerInterval);

            let fakeTime = new Date(Date.now() + futureOffset * 60000);
            let fakeTotalMinutes = fakeTime.getHours() * 60 + fakeTime.getMinutes();

            function doRewind() {
                const now = new Date();
                const realTotalMinutes = now.getHours() * 60 + now.getMinutes();

                if (fakeTotalMinutes <= realTotalMinutes) {
                    mode = "normal";
                    startClock(); 
                    return;
                }

                fakeTotalMinutes--;
                let h = Math.floor(fakeTotalMinutes / 60) % 24;
                let m = fakeTotalMinutes % 60;
                setTimeDisplay(h, m);

                let diff = fakeTotalMinutes - realTotalMinutes;
                let currentDelay = 80; 

                if (diff <= 3) { currentDelay = 800; } 
                else if (diff <= 6) { currentDelay = 400; } 
                else if (diff <= 8) { currentDelay = 200; }

                setTimeout(doRewind, currentDelay);
            }
            doRewind();
        }

        startClock();
    </script>
</body>
</html>
