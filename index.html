<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Полная маскировка под iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeHacker">
    
    <title>Lock Screen</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        
        html, body { 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
        }
        
        /* Растяжение обоев пиксель в пиксель без швов */
        .lockscreen { 
            position: absolute; 
            inset: 0;
            width: 100%; height: 100%;
            background: url('my_screen.png') center/cover no-repeat; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow: hidden; z-index: 1;
        }

        .clock-container { text-align: center; width: 100%; margin-top: 105px; }
        .date { font-size: 21px; color: #fff; font-weight: 500; letter-spacing: -0.1px; margin-bottom: 0px; opacity: 0.95; }
        .time { font-size: 102px; font-weight: 700; color: rgba(255, 255, 255, 0.44); letter-spacing: -3px; line-height: 0.9; }

        /* ИНТЕРФЕЙС УПРАВЛЕНИЯ (Полностью невидимый) */
        .clicker-zone { position: fixed; top: 0; left: 0; width: 100%; height: 40%; z-index: 999; display: flex; }
        .btn-left { width: 33.3%; height: 100%; cursor: pointer; }
        .btn-center { width: 33.3%; height: 100%; cursor: pointer; }
        .btn-right { width: 33.4%; height: 100%; cursor: pointer; }
        
        /* Нижняя зона для отмотки времени назад */
        .trigger-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 55%; z-index: 997; cursor: pointer; }
        
        /* Скрытая кнопка настоящего фонарика поверх твоих обоев */
        .flashlight-trigger {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 48px); left: 35px;
            width: 54px; height: 54px; border-radius: 50%;
            z-index: 1000; cursor: pointer;
            background: rgba(255,255,255,0.01); 
        }
        video { display: none; }
    </style>
</head>
<body>

    <!-- Скрытая панель кликов (Верхние 40% экрана) -->
    <div class="clicker-zone">
        <div class="btn-left" onclick="changeDecades()"></div>
        <div class="btn-center" onclick="changeUnits()"></div>
        <div class="btn-right" onclick="lockAndGoToFuture()"></div>
    </div>

    <!-- Нижняя половина экрана для запуска финального замедления -->
    <div class="trigger-bottom" onclick="rewindToPresent()"></div>

    <!-- Фонарик -->
    <div class="flashlight-trigger" onclick="toggleFlashlight()"></div>
    <video id="flashVideo" autoplay playsinline></video>

    <!-- Экран блокировки -->
    <div class="lockscreen">
        <div class="clock-container">
            <div class="date" id="dateDisplay">Thu Aug 13</div>
            <div class="time" id="timeDisplay">06:00</div>
        </div>
    </div>

    <script>
        let mode = "normal"; 
        let futureOffset = 10; 
        let timerInterval;
        let track = null;

        // Переменные для фиксации времени тапами
        let currentH = 0;
        let currentM = 0;

        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        function updateDate() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('dateDisplay').innerText = `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()}`;
        }
        updateDate();

        function startClock() {
            timerInterval = setInterval(() => {
                const now = new Date();
                if (mode === "normal") {
                    currentH = now.getHours();
                    currentM = now.getMinutes();
                    setTimeDisplay(currentH, currentM);
                } else if (mode === "future") {
                    const futureTime = new Date(Date.now() + futureOffset * 60000);
                    setTimeDisplay(futureTime.getHours(), futureTime.getMinutes());
                }
            }, 1000);
        }

        function setTimeDisplay(h, m) {
            document.getElementById('timeDisplay').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        // МЕТОД ТАПОВ (Ввод времени без клавиатуры)
        
        // 1. Клики СЛЕВА: меняют первую цифру минут (Десятки: 0 -> 1 -> 2 -> 3 -> 4 -> 5 -> 0)
        function changeDecades() {
            if (mode !== "normal" && mode !== "edit") return;
            mode = "edit";
            let dec = Math.floor(currentM / 10);
            let unit = currentM % 10;
            dec = (dec + 1) > 5 ? 0 : dec + 1;
            currentM = dec * 10 + unit;
            setTimeDisplay(currentH, currentM);
        }

        // 2. Клики ПО ЦЕНТРУ: меняют вторую цифру минут (Единицы: 0 -> 1 -> 2 ... -> 9 -> 0)
        function changeUnits() {
            if (mode !== "normal" && mode !== "edit") return;
            mode = "edit";
            let dec = Math.floor(currentM / 10);
            let unit = currentM % 10;
            unit = (unit + 1) > 9 ? 0 : unit + 1;
            currentM = dec * 10 + unit;
            setTimeDisplay(currentH, currentM);
        }

        // 3. Клик СПРАВА: фиксирует время (первый шок), а при повторном клике переводит в Будущее (+10 мин)
        function lockAndGoToFuture() {
            if (mode === "edit") {
                mode = "static"; // Фиксация названного времени девушки
            } else if (mode === "static") {
                mode = "future"; // Переключение на будущее время (+10 минут)
            }
        }

        // ФИНАЛ: Медленный возврат времени (Клик по нижней части экрана)
        function rewindToPresent() {
            if (mode !== "future") return;
            mode = "rewinding";
            clearInterval(timerInterval);

            let fakeTime = new Date(Date.now() + futureOffset * 60000);
            let fakeTotalMinutes = fakeTime.getHours() * 60 + fakeTime.getMinutes();

            function doRewind() {
                const now = new Date();
                const realTotalMinutes = now.getHours() * 60 + now.getMinutes();

                if (fakeTotalMinutes <= realTotalMinutes) {
                    mode = "normal";
                    startClock(); 
                    return;
                }

                fakeTotalMinutes--;
                let h = Math.floor(fakeTotalMinutes / 60) % 24;
                let m = fakeTotalMinutes % 60;
                setTimeDisplay(h, m);

                let diff = fakeTotalMinutes - realTotalMinutes;
                let currentDelay = 80; 

                if (diff <= 3) { currentDelay = 800; } 
                else if (diff <= 6) { currentDelay = 400; } 
                else if (diff <= 8) { currentDelay = 200; }

                setTimeout(doRewind, currentDelay);
            }
            doRewind();
        }

        // Аппаратный фонарик
        async function toggleFlashlight() {
            try {
                if (!track) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const video = document.getElementById('flashVideo');
                    video.srcObject = stream;
                    track = stream.getVideoTracks();
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                } else {
                    await track.applyConstraints({ advanced: [{ torch: false }] });
                    track.stop();
                    track = null;
                }
            } catch (err) {
                console.log("Вспышка недоступна");
            }
        }

        startClock();
    </script>
</body>
</html>
