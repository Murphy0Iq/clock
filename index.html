<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Маскировка под нативное приложение для скрытия Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeHacker">
    
    <title>Lock Screen</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        
        /* Основной контейнер экрана */
        .lockscreen { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding-top: calc(env(safe-area-inset-top) + 40px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
            overflow: hidden;
        }

        /* ЗАДНИЙ СЛОЙ ОБOЕВ (За часами) */
        .bg-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://ibb.co') center/cover no-repeat;
            z-index: 1;
        }

        /* ЧАСЫ И ДАТА (Слой посередине) */
        .clock-container {
            position: relative;
            text-align: center;
            width: 100%;
            z-index: 2; /* Выше заднего фона, но ниже переднего */
        }
        
        .date { 
            font-size: 21px; 
            color: #fff; 
            font-weight: 500; 
            letter-spacing: -0.2px;
            margin-bottom: 2px;
            opacity: 0.95;
        }
        
        /* Прозрачный стеклянный шрифт как на твоем скриншоте */
        .time { 
            font-size: 102px; 
            font-weight: 700; 
            color: rgba(255, 255, 255, 0.45); 
            letter-spacing: -3px; 
            line-height: 0.9; 
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        /* ПЕРЕДНИЙ СЛОЙ ОБОЕВ (Накладывается ПОВЕРХ часов для эффекта глубины) */
        .bg-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://ibb.co') center/cover no-repeat;
            z-index: 3; /* Перекрывает нижнюю часть цифр часов */
            pointer-events: none; /* Пропускает клики сквозь себя */
        }

        /* ИНТЕРФЕЙС И ВИДЖЕТЫ (Самый верхний слой) */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 140px) 35px calc(env(safe-area-inset-bottom) + 50px);
            z-index: 10;
            pointer-events: none;
        }

        /* Виджеты под часами */
        .widgets-row {
            display: flex; justify-content: center; gap: 15px; margin-top: 10px;
            pointer-events: auto;
        }
        .widget-img { height: 42px; opacity: 0.85; }

        /* Нижняя панель с кнопками фонарика и камеры */
        .bottom-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            margin-bottom: 20px; pointer-events: auto;
        }
        .sys-btn { width: 50px; height: 50px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .sys-btn img { width: 22px; height: 22px; opacity: 0.9; }

        /* Домашняя полоса iOS в самом низу */
        .home-bar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 5px; background: #fff; border-radius: 10px; z-index: 11;
        }

        /* СКРЫТЫЕ ЗОНЫ КЛИКА ДЛЯ ТЕБЯ */
        .trigger-left { position: absolute; top: 0; left: 0; width: 30%; height: 35%; z-index: 998; cursor: pointer; }
        .trigger-right { position: absolute; top: 0; right: 0; width: 30%; height: 35%; z-index: 998; cursor: pointer; }
        .trigger-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; z-index: 997; cursor: pointer; }
        #hiddenInput { position: absolute; top: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; z-index: 10000; }
    </style>
</head>
<body>

    <!-- Скрытые триггеры -->
    <div class="trigger-left" onclick="openSecretInput()"></div>
    <div class="trigger-right" onclick="setToFutureTime()"></div>
    <div class="trigger-bottom" onclick="rewindToPresent()"></div>
    <input type="text" id="hiddenInput" pattern="\d*" maxlength="4" oninput="updateStaticTime(this)">

    <!-- Обои и Часы -->
    <div class="bg-back"></div>
    
    <div class="lockscreen">
        <div class="clock-container">
            <div class="date" id="dateDisplay">Thu Aug 13</div>
            <div class="time" id="timeDisplay">06:00</div>
        </div>
    </div>

    <div class="bg-front"></div>

    <!-- Графика системного интерфейса iOS (Иконки и виджеты с твоего скрина) -->
    <div class="ui-layer">
        <div class="widgets-row">
            <!-- Виджет погоды слева -->
            <img src="https://ibb.co" class="widget-img">
            <!-- Виджет батареи по центру -->
            <img src="https://ibb.co" class="widget-img">
            <!-- Виджет дома справа -->
            <img src="https://ibb.co" class="widget-img">
        </div>
        
        <div class="bottom-row">
            <div class="sys-btn"><img src="https://ibb.co"></div>
            <div class="sys-btn"><img src="https://ibb.co"></div>
        </div>
    </div>
    
    <div class="home-bar"></div>

    <script>
        let mode = "normal"; 
        let futureOffset = 10; 
        let targetHours = 0;
        let targetMinutes = 0;
        let timerInterval;

        // Форматирование даты строго как на твоем скрине: Thu Aug 13
        function updateDate() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
            
            // Если месяц не август, код подставит текущий, но формат будет один в один
            const currentMonthName = now.getMonth() === 7 ? 'Aug' : months[now.getMonth()];
            
            document.getElementById('dateDisplay').innerText = `${days[now.getDay()]} ${currentMonthName} ${now.getDate()}`;
        }
        updateDate();

        function startClock() {
            timerInterval = setInterval(() => {
                if (mode === "normal") {
                    const now = new Date();
                    setTimeDisplay(now.getHours(), now.getMinutes());
                } else if (mode === "future") {
                    const futureTime = new Date(Date.now() + futureOffset * 60000);
                    setTimeDisplay(futureTime.getHours(), futureTime.getMinutes());
                }
            }, 1000);
        }

        function setTimeDisplay(h, m) {
            document.getElementById('timeDisplay').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function openSecretInput() {
            if (mode !== "normal") return;
            mode = "static";
            const input = document.getElementById('hiddenInput');
            input.value = "";
            input.focus();
        }

        function updateStaticTime(input) {
            let val = input.value;
            if (val.length === 4) {
                targetHours = parseInt(val.substring(0, 2));
                targetMinutes = parseInt(val.substring(2, 4));
                if(targetHours > 23 || targetMinutes > 59) { input.value = ""; return; }
                setTimeDisplay(targetHours, targetMinutes);
                input.blur();
            }
        }

        function setToFutureTime() {
            if (mode !== "static") return;
            mode = "future";
        }

        function rewindToPresent() {
            if (mode !== "future") return;
            mode = "rewinding";
            clearInterval(timerInterval);

            let fakeTime = new Date(Date.now() + futureOffset * 60000);
            let fakeTotalMinutes = fakeTime.getHours() * 60 + fakeTime.getMinutes();

            function doRewind() {
                const now = new Date();
                const realTotalMinutes = now.getHours() * 60 + now.getMinutes();

                if (fakeTotalMinutes <= realTotalMinutes) {
                    mode = "normal";
                    startClock(); 
                    return;
                }

                fakeTotalMinutes--;
                let h = Math.floor(fakeTotalMinutes / 60) % 24;
                let m = fakeTotalMinutes % 60;
                setTimeDisplay(h, m);

                let diff = fakeTotalMinutes - realTotalMinutes;
                let currentDelay = 80; 

                if (diff <= 3) { currentDelay = 800; } 
                else if (diff <= 6) { currentDelay = 400; } 
                else if (diff <= 8) { currentDelay = 200; }

                setTimeout(doRewind, currentDelay);
            }
            doRewind();
        }

        startClock();
    </script>
</body>
</html>
